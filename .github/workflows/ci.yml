name: ci

on:
  push:
    branches: [devel, main, 'release/*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint (Markdown, Python, GeoJSON, HTML, traceability)
        run: make lint
      - name: Test lint tools
        run: make test-tools
