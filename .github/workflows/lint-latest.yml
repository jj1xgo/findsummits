name: lint (latest tools)

# schedule と workflow_dispatch は、既定のブランチ（main）にあるこのファイルだけを動かす。
# devel にしか無い間は動かず、最初のリリース（release/* → main）で main に入ってから動き始める
# （findsummits#346。2026-11-19 にメンテナが、それまで動かないことを受け入れると決めた）。

on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 00:00 UTC（JST 09:00）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run lint with latest tools
        run: make lint-latest
