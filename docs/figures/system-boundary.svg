<svg width="1400" height="970" viewBox="0 0 1400 970" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HLD 境界図"><title>境界図</title><desc>findsummits のシステム境界と、申請担当者・SOTA 日本支部マネージャ・外部のデータと配信との接続。線の記号 A〜G の内容は HLD §2.1.2 の本文を参照。</desc><style><![CDATA[svg { font-family: "Noto Sans CJK JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; background: #fff; }
text { font-size: 18px; fill: #111827; }
.b { font-weight: 700; } .ttl { font-size: 26px; font-weight: 700; }
.w { fill: #fff; font-weight: 700; } .blue { fill: #1d4ed8; }
.s { font-size: 15px; } .m { font-size: 16px; }
.k { font-size: 15px; fill: #fff; font-weight: 700; }]]></style>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <text x="30" y="42" class="ttl">境界図（findsummits）</text>
  <rect x="30" y="56" width="150" height="32" rx="4" fill="#334155"/>
  <text x="105" y="79" class="w" text-anchor="middle">HLD §2.1.2</text>
  <text x="195" y="79">出典: HLD §2.1.3、SRS §3.1・§6.1・§7.1・§9</text>

  <!-- 凡例 行1: 線種 -->
  <line x1="30" y1="122" x2="90" y2="122" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <text x="100" y="128">データ・操作の流れ</text>
  <line x1="330" y1="122" x2="390" y2="122" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ah2)"/>
  <text x="400" y="128">ネットワーク接続（HTTPS）</text>
  <line x1="680" y1="122" x2="740" y2="122" stroke="#334155" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#ah1)"/>
  <text x="750" y="128">システムの外のやり取り</text>
  <!-- 凡例 行2: 箱 -->
  <rect x="30" y="150" width="34" height="22" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="72" y="168">外部データ・外部サービス</text>
  <rect x="320" y="150" width="34" height="22" fill="#dbeafe" stroke="#2563eb"/>
  <text x="362" y="168">バッチ（C1〜C6）</text>
  <rect x="560" y="150" width="34" height="22" fill="#d1fae5" stroke="#059669"/>
  <text x="602" y="168">ブラウザ内で動く（C7・C8）</text>
  <rect x="890" y="150" width="34" height="22" fill="#ffedd5" stroke="#ea580c"/>
  <text x="932" y="168">関係者</text>

  <!-- 関係者 -->
  <rect x="30" y="210" width="950" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="48" y="244" class="b">申請担当者（利用者）</text>
  <text x="48" y="282" class="m">コマンドの起動、参照データの手動配置、ビューアの操作、公開用データの配置、成果物の受け取り</text>

  <rect x="1070" y="210" width="300" height="96" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="1088" y="244" class="b">SOTA 日本支部マネージャ</text>
  <text x="1088" y="282" class="s">申請書類の受領、公開用ビューアの閲覧</text>

  <!-- 申請書類の提出（システムの外） -->
  <line x1="980" y1="258" x2="1068" y2="258" stroke="#334155" stroke-width="2.5" stroke-dasharray="2 5" marker-end="url(#ah1)"/>
  <text x="1025" y="200" class="s" text-anchor="middle">申請書 XLSX・申請エビデンス ZIP を提出</text>

  <!-- システム境界 -->
  <rect x="30" y="380" width="950" height="350" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3"/>
  <text x="48" y="408" class="b blue">findsummits のシステム境界</text>

  <!-- バッチ側 -->
  <rect x="50" y="420" width="380" height="290" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="65" y="448" class="b">バッチ側（ローカルで実行）</text>
  <rect x="65" y="462" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="490" class="m b">C1 行政区域前処理</text>
  <text x="78" y="517" class="s">初回と更新時に前処理</text>
  <rect x="245" y="462" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="490" class="m b">C2 タイル取得</text>
  <text x="258" y="517" class="s">標高タイルを事前取得</text>
  <rect x="65" y="542" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="570" class="m b">C3 パイプライン制御</text>
  <text x="78" y="597" class="s">フェーズ2〜4 を制御</text>
  <rect x="245" y="542" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="570" class="m b">C4 地形解析エンジン</text>
  <text x="258" y="597" class="s">ピーク・コルの解析</text>
  <rect x="65" y="622" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="78" y="650" class="m b">C5 統合・突合</text>
  <text x="78" y="677" class="s">統合と SOTA 突合</text>
  <rect x="245" y="622" width="170" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="650" class="m b">C6 可視化生成</text>
  <text x="258" y="677" class="s">作業用ビューアを生成</text>

  <!-- バッチ → C7（作業用 HTML ビューア） -->
  <line x1="430" y1="620" x2="518" y2="620" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <text x="474" y="586" class="s" text-anchor="middle">作業用</text>
  <text x="474" y="606" class="s" text-anchor="middle">ビューア</text>

  <!-- C7 -->
  <rect x="520" y="420" width="220" height="290" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="535" y="450" class="b">C7 申請書生成 UI</text>
  <text x="535" y="478" class="s">作業用ビューアの中で動く</text>
  <text x="535" y="520" class="s">・確認、rationale の編集</text>
  <text x="535" y="546" class="s">・除外判断</text>
  <text x="535" y="572" class="s">・申請書類を作る</text>

  <!-- C8 -->
  <rect x="760" y="420" width="200" height="290" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="775" y="450" class="b">C8 公開用ビューア</text>
  <text x="775" y="478" class="s">リポジトリに置く</text>
  <text x="775" y="520" class="s">・テンプレート</text>
  <text x="775" y="546" class="s">・公開用データ</text>
  <text x="775" y="572" class="s">（GeoJSON 5 本）</text>
  <text x="775" y="614" class="s">閲覧者のブラウザの</text>
  <text x="775" y="638" class="s">中で動く</text>

  <!-- 申請担当者と境界の内側の線 -->
  <line x1="320" y1="306" x2="320" y2="418" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="297" y="343" width="46" height="24" rx="12" fill="#334155"/>
  <text x="320" y="361" class="k" text-anchor="middle">A·B</text>

  <line x1="400" y1="420" x2="400" y2="308" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="385" y="343" width="30" height="24" rx="12" fill="#334155"/>
  <text x="400" y="361" class="k" text-anchor="middle">C</text>

  <line x1="580" y1="306" x2="580" y2="418" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="565" y="343" width="30" height="24" rx="12" fill="#334155"/>
  <text x="580" y="361" class="k" text-anchor="middle">D</text>

  <line x1="690" y1="420" x2="690" y2="308" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="675" y="343" width="30" height="24" rx="12" fill="#334155"/>
  <text x="690" y="361" class="k" text-anchor="middle">E</text>

  <line x1="860" y1="306" x2="860" y2="418" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="845" y="343" width="30" height="24" rx="12" fill="#334155"/>
  <text x="860" y="361" class="k" text-anchor="middle">F</text>

  <!-- 静的ホスティング -->
  <rect x="1070" y="540" width="300" height="120" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1088" y="574" class="b">静的ホスティング</text>
  <text x="1088" y="604" class="s">外部サービス（サービスは未決）</text>
  <text x="1088" y="630" class="s">C8 と公開用データを配信</text>

  <line x1="960" y1="600" x2="1068" y2="600" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <rect x="999" y="576" width="30" height="24" rx="12" fill="#334155"/>
  <text x="1014" y="594" class="k" text-anchor="middle">G</text>

  <line x1="1220" y1="540" x2="1220" y2="308" stroke="#334155" stroke-width="2.5" marker-end="url(#ah1)"/>
  <text x="1232" y="420" class="s">閲覧</text>
  <text x="1232" y="442" class="s">（公開用ビューア）</text>

  <!-- 外部データ（事前取得） -->
  <rect x="50" y="800" width="380" height="110" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="68" y="834" class="b">国土地理院 標高タイル</text>
  <text x="68" y="864" class="s">DEM5a・5b・5c・DEM10b</text>
  <text x="68" y="890" class="s">C2 が事前に取得してキャッシュに置く</text>
  <line x1="240" y1="800" x2="240" y2="712" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ah2)"/>
  <text x="252" y="772" class="s blue">HTTPS・事前取得（C2）</text>

  <!-- 外部（実行時接続） -->
  <rect x="520" y="800" width="440" height="140" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="538" y="832" class="b">ブラウザが実行時に接続する外部</text>
  <text x="538" y="860" class="s">・背景タイル（地理院地図 2 種・OSM・OpenTopoMap）</text>
  <text x="538" y="884" class="s">・地理院標高タイル（等高線用）、地理院基準点タイル</text>
  <text x="538" y="908" class="s">・CDN（Leaflet・SheetJS・JSZip）</text>
  <line x1="630" y1="800" x2="630" y2="712" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ah2)"/>
  <line x1="860" y1="800" x2="860" y2="712" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#ah2)"/>
  <text x="642" y="772" class="s blue">HTTPS・実行時（C7・C8）</text>

  <!-- 線の記号 -->
  <rect x="1070" y="700" width="300" height="240" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1088" y="732" class="b">線の記号</text>
  <rect x="1088" y="746" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="762" class="k" text-anchor="middle">A</text>
  <text x="1128" y="763" class="s">起動・メッシュ・フェーズの指定</text>
  <rect x="1088" y="774" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="790" class="k" text-anchor="middle">B</text>
  <text x="1128" y="791" class="s">参照データの手動配置</text>
  <rect x="1088" y="802" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="818" class="k" text-anchor="middle">C</text>
  <text x="1128" y="819" class="s">バッチの成果物</text>
  <rect x="1088" y="830" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="846" class="k" text-anchor="middle">D</text>
  <text x="1128" y="847" class="s">ビューア入力・除外判断ファイル</text>
  <rect x="1088" y="858" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="874" class="k" text-anchor="middle">E</text>
  <text x="1128" y="875" class="s">申請書類・除外判断 JSON</text>
  <rect x="1088" y="886" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="902" class="k" text-anchor="middle">F</text>
  <text x="1128" y="903" class="s">公開用データの配置</text>
  <rect x="1088" y="914" width="30" height="22" rx="11" fill="#334155"/><text x="1103" y="930" class="k" text-anchor="middle">G</text>
  <text x="1128" y="931" class="s">公開用データの配信</text>
</svg>
